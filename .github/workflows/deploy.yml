name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy to PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Guard against empty SHA
          if [ -z "$GIT_COMMIT_SHA" ]; then
            echo "Error: GIT_COMMIT_SHA is empty; aborting deploy"
            exit 1
          fi
          # Checkout correct commit and deploy
          curl -s -X POST \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/consoles/" \
            -H "Authorization: Token $PA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"executable\": \"bash\", \"arguments\": \"-c 'git -C ~/todo fetch origin && git -C ~/todo checkout $GIT_COMMIT_SHA && mkdir -p ~/todo/logs && cd ~/todo && source .venv/bin/activate && uv pip sync requirements/production.txt && python manage.py migrate && python manage.py collectstatic --noinput'\"}"

          # Reload web app
          curl -s -X POST \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/webapps/$PA_USERNAME.pythonanywhere.com/reload/" \
            -H "Authorization: Token $PA_API_TOKEN"

      - name: Verify deployment
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$PA_USERNAME.pythonanywhere.com/health/")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Deployment verified - health check returned 200"
